name: Integration feedback
description: Share structured feedback from a real voice pipeline
title: "[Integration]: "
labels: [integration]
body:
  - type: input
    id: stack
    attributes:
      label: Stack
      placeholder: model, TTS, audio transport, runtime
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Integration status
      options: [working, blocked, evaluating]
    validations:
      required: true
  - type: textarea
    id: useful
    attributes:
      label: What was useful?
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What caused friction or was missing?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, transcripts, prompts, and private audio from this report.
          required: true
